[package]
name = "pz-workshop-downloader"
version = "1.0.1"
edition = "2024"
license = "MIT"
description = "A minimal native Windows downloader for Project Zomboid Workshop mods"
repository = "https://github.com/whisperbtw/workshop-device"
readme = "README.md"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = "=0.5.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Globalization"] }

[build-dependencies]
winresource = "=0.1.31"

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
strip = true
