name: Windows validation and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo audit
      - name: Release build
        run: cargo build --release --locked
      - name: Install packaging tools
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-about --version 0.9.2 --locked
      - name: License notices
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo about generate --locked --fail scripts/licenses.hbs -o THIRD-PARTY-NOTICES.html
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match Cargo.toml version' }
          ./scripts/package.ps1 -SkipBuild
      - name: Save release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES.html
          if-no-files-found: error

  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Fetch artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: pwsh
        run: gh run download $env:RUN_ID --repo $env:REPO --name windows-release --dir dist
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:REPO 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; preserving its assets.'; exit 0 }
          $assets = (Get-ChildItem dist -File).FullName
          gh release create $env:RELEASE_TAG @assets --repo $env:REPO --verify-tag --title "Workshop Device $env:RELEASE_TAG" --notes-file RELEASE-NOTES.md
